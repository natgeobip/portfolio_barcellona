<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Work Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker></defs>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0b1f3a">From data to decisions in five steps</text>
<text x="40" y="80" font-size="15" fill="#5b6573">Flood maps are prepared in advance; live information is added on top</text>
<g text-anchor="middle">
<rect x="40" y="120" width="188" height="130" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="134" y="152" font-size="13" font-weight="700" fill="#e5322d">1</text>
<text x="134" y="188" font-size="19" font-weight="700" fill="#1c2430">Data</text>
<text x="134" y="214" font-size="14" fill="#1c2430" opacity=".85">Satellite, terrain, plans</text>
<rect x="268" y="120" width="188" height="130" rx="10" fill="#0b1f3a" stroke="#0b1f3a"/>
<text x="362" y="152" font-size="13" font-weight="700" fill="#ffffff">2</text>
<text x="362" y="188" font-size="19" font-weight="700" fill="#ffffff">Analysis</text>
<text x="362" y="214" font-size="14" fill="#ffffff" opacity=".85">Risk maps and scenarios</text>
<rect x="496" y="120" width="188" height="130" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="590" y="152" font-size="13" font-weight="700" fill="#e5322d">3</text>
<text x="590" y="188" font-size="19" font-weight="700" fill="#1c2430">Map services</text>
<text x="590" y="214" font-size="14" fill="#1c2430" opacity=".85">Published online</text>
<rect x="724" y="120" width="188" height="130" rx="10" fill="#e5322d" stroke="#e5322d"/>
<text x="818" y="152" font-size="13" font-weight="700" fill="#ffffff">4</text>
<text x="818" y="188" font-size="19" font-weight="700" fill="#ffffff">Web and mobile</text>
<text x="818" y="214" font-size="14" fill="#ffffff" opacity=".85">Maps, 3D, dashboards</text>
<rect x="952" y="120" width="208" height="130" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="1056" y="152" font-size="13" font-weight="700" fill="#e5322d">5</text>
<text x="1056" y="188" font-size="19" font-weight="700" fill="#1c2430">Decisions</text>
<text x="1056" y="214" font-size="14" fill="#1c2430" opacity=".85">Where to act first</text>
</g>
<line x1="228" y1="185" x2="264" y2="185" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<line x1="456" y1="185" x2="492" y2="185" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<line x1="684" y1="185" x2="720" y2="185" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<line x1="912" y1="185" x2="948" y2="185" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="318" font-size="15" font-weight="700" fill="#0b1f3a" letter-spacing="1">LIVE INFORMATION ADDED ON TOP</text>
<g text-anchor="middle">
<rect x="496" y="345" width="188" height="90" rx="10" fill="#ffffff" stroke="#e5322d"/>
<text x="590" y="383" font-size="18" font-weight="700" fill="#1c2430">Weather forecasts</text>
<text x="590" y="408" font-size="14" fill="#1c2430" opacity=".85">Near real time</text>
<rect x="724" y="345" width="188" height="90" rx="10" fill="#ffffff" stroke="#e5322d"/>
<text x="818" y="383" font-size="18" font-weight="700" fill="#1c2430">Citizen reports</text>
<text x="818" y="408" font-size="14" fill="#1c2430" opacity=".85">Problems seen on the street</text>
<rect x="952" y="345" width="208" height="90" rx="10" fill="#ffffff" stroke="#e5322d"/>
<text x="1056" y="383" font-size="18" font-weight="700" fill="#1c2430">Crew updates</text>
<text x="1056" y="408" font-size="14" fill="#1c2430" opacity=".85">Drain status from the field</text>
</g>
<line x1="590" y1="345" x2="590" y2="258" stroke="#e5322d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="818" y1="345" x2="818" y2="258" stroke="#e5322d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="1056" y1="345" x2="1056" y2="258" stroke="#e5322d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="40" y="470" font-size="15" fill="#5b6573">Live information does not change the risk maps. It shows the situation right now.</text>
</svg>
