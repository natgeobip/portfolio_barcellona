<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Work Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0b1f3a">DRAINS demonstrator: from data to decisions</text>
<text x="40" y="80" font-size="15" fill="#5b6573">Processing, publication and consultation are kept separate and connected through standard services</text>
<rect x="40" y="130" width="190" height="120" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="135" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">Data sources</text>
<text x="135" y="208" text-anchor="middle" font-size="14" fill="#1c2430" opacity=".85">Satellite, terrain, rain</text>
