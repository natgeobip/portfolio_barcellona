<text x="385" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Analytical pipeline</text>
<text x="385" y="208" text-anchor="middle" font-size="14" fill="#ffffff" opacity=".85">Python, open source</text>
<rect x="540" y="130" width="190" height="120" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="635" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">Validated outputs</text>
<text x="635" y="208" text-anchor="middle" font-size="14" fill="#1c2430" opacity=".85">Maps, scenarios, grids</text>
<rect x="790" y="130" width="170" height="120" rx="10" fill="#f3f4f6" stroke="#d9dde3"/>
<text x="875" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">GIS services</text>
<text x="875" y="208" text-anchor="middle" font-size="14" fill="#1c2430" opacity=".85">Published layers</text>
<rect x="1010" y="130" width="150" height="120" rx="10" fill="#e5322d" stroke="#e5322d"/>
<text x="1085" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Web app</text>
<text x="1085" y="208" text-anchor="middle" font-size="14" fill="#ffffff" opacity=".85">Maps, 3D, dashboards</text>
<line x1="230" y1="190" x2="286" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="190" x2="536" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
<line x1="730" y1="190" x2="786" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#a)"/>
