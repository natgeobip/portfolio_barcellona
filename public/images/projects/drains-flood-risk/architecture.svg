<text x="40" y="320" font-size="15" font-weight="700" fill="#0b1f3a" letter-spacing="1">FEEDBACK FROM THE TERRITORY</text>
<rect x="540" y="350" width="190" height="110" rx="10" fill="#ffffff" stroke="#e5322d"/>
<text x="635" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">Citizen reports</text>
<text x="635" y="423" text-anchor="middle" font-size="14" fill="#1c2430" opacity=".85">Blocked or flooded drains</text>
<rect x="790" y="350" width="170" height="110" rx="10" fill="#ffffff" stroke="#e5322d"/>
<text x="875" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">Field surveys</text>
<text x="875" y="423" text-anchor="middle" font-size="14" fill="#1c2430" opacity=".85">Drain position and status</text>
<line x1="635" y1="350" x2="635" y2="258" stroke="#e5322d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="875" y1="350" x2="875" y2="258" stroke="#e5322d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="40" y="410" font-size="15" fill="#5b6573">Reports and surveys are kept distinct by origin, accuracy and validation status.</text>
